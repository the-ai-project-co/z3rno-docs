name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint + link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Markdown lint
        shell: bash
        run: |
          markdownlint-cli2 '**/*.md' '#node_modules' || {
            echo "::warning::markdownlint found issues (non-blocking in skeleton mode)"
            exit 0
          }

      - name: Lychee — broken link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-mail
            --exclude 'https://api.z3rno.dev'
            --exclude 'github.com/the-ai-project-co'
            --exclude 'github.com/z3rno'
            '**/*.md'
          fail: false
